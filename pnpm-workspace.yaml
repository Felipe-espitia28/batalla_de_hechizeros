# Workspaces del monorepo (sección 5 de CLAUDE.md).
# Sin Turborepo ni Nx: pnpm --filter y -r bastan para 4 apps, 2 servicios y 4 paquetes.
packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 12 bloquea los scripts de instalación por seguridad. Solo se aprueban los necesarios:
# Prisma descarga su motor de migraciones y esbuild (lo usa tsx) instala su binario.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
